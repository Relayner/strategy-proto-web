<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#171c24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="play">
  <title>play · Стратегия — проверка</title>
  <link rel="manifest" href="index.manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>/* Colors follow the game's own menu (scripts/ui/boot.gd, scripts/ui/ui_theme.gd): background, accent, dim text.
   Interface pass 04.11.2026 (no style change): three text sizes (--fs-title / --fs-body / --fs-small = 28 / 19 / 13),
   every tap target at least 44 px tall, a press that shrinks to 96 % in 80 ms with an ease-out curve. */
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#171c24;color:#fff;--accent:#ffc21f;--muted:#c7ccd6;--line:#3a4352;--panel:#0f1217e6;--sky-top:#0f1a2b;--sky-low:#2a3146;--ridge-far:#1b2433;--ridge-near:#121820;--field:#1e2a22;--fs-title:28px;--fs-body:19px;--fs-small:13px;--tap:44px;--press:cubic-bezier(.2,.8,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;font-size:var(--fs-body);color:inherit;cursor:pointer;border:1px solid var(--line);background:#222a36cc;border-radius:12px;min-height:48px;padding:10px 18px;touch-action:manipulation;text-align:left;transition:border-color .15s,background .15s,transform 80ms var(--press)}
button:hover{border-color:var(--accent)}
button:active{background:#2c3646;transform:scale(.96)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#171c24;font-weight:700;font-size:var(--fs-body);letter-spacing:.01em;text-align:center}
button.primary:active{background:#e0a910}
button.accent{border-color:var(--accent);color:var(--accent);font-weight:600;text-align:center;background:#2a2410cc}
button.quiet{background:transparent;border-color:transparent;color:var(--muted);font-size:var(--fs-small);min-height:var(--tap);padding:6px 10px}
/* The game keeps the layout it had as a plain Godot page: left/right safe areas stay black, as without viewport-fit=cover. */
#game{position:fixed;top:0;bottom:0;left:env(safe-area-inset-left);right:env(safe-area-inset-right);background:#000}
#game iframe{display:block;width:100%;height:100%;border:0}
#gate{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--sky-top);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* Drawn backdrop: evening sky, a low sun, two ridges and the fields of the surface game. No images, no requests. */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky-top) 0%,#1d2740 45%,var(--sky-low) 62%,var(--field) 100%)}
.sun{position:absolute;left:62%;top:34%;width:min(26vmin,150px);height:min(26vmin,150px);border-radius:50%;background:radial-gradient(circle at 45% 40%,#ffe08a,#ffc21f 55%,#e09a10 80%);box-shadow:0 0 60px 20px #ffc21f33,0 0 140px 60px #ffc21f14;animation:sun 90s ease-in-out infinite alternate}
.ridge{position:absolute;left:-10%;right:-10%;height:34%;bottom:26%;background:var(--ridge-far);clip-path:polygon(0 70%,8% 52%,15% 60%,24% 38%,31% 50%,40% 30%,48% 46%,57% 34%,66% 52%,74% 40%,83% 58%,91% 44%,100% 60%,100% 100%,0 100%)}
.ridge-near{bottom:18%;height:28%;background:var(--ridge-near);clip-path:polygon(0 60%,10% 48%,19% 64%,27% 42%,36% 56%,45% 36%,54% 54%,63% 44%,72% 62%,80% 46%,89% 58%,100% 40%,100% 100%,0 100%)}
.fields{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(100deg,#1e2a22 0 14px,#223126 14px 28px),var(--field);mask-image:linear-gradient(180deg,transparent,#000 30%);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%)}
@keyframes sun{from{transform:translate(0,0)}to{transform:translate(-4vmin,2vmin)}}
@media (prefers-reduced-motion:reduce){.sun{animation:none}}
.gate-card{position:relative;width:min(560px,100%);display:grid;grid-template-columns:1fr;gap:24px}
.gate-card.with-notes{width:min(900px,100%);grid-template-columns:minmax(0,1fr) minmax(0,300px);align-items:start}
.gate-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,260px);grid-template-areas:"brand actions" "footer footer";gap:14px 22px;padding:20px 22px;border:1px solid #ffffff14;border-radius:20px;background:#0f1217cc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 20px 60px #0008}
.brand{grid-area:brand;min-width:0}
.crest{width:56px;height:56px;border-radius:14px;display:block;margin:0 0 10px;box-shadow:0 6px 24px #0008}
.eyebrow{text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-size:var(--fs-small);margin:0 0 6px}
h1{font-size:var(--fs-title);font-weight:700;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
#gate-message{color:var(--muted);font-size:var(--fs-small);line-height:1.45;margin:0 0 8px;min-height:1em}
/* Drawn state badge before the status line (app.js status(message, state)): ring — checking or loading, dot — ready,
   crossed circle — offline, exclamation — error. The text beside it keeps the meaning; the badge is what the eye catches. */
#gate[data-state] #gate-message::before{content:"";display:inline-block;box-sizing:border-box;width:14px;height:14px;margin:0 8px 0 0;vertical-align:-2px;border-radius:50%;transition:opacity .2s}
#gate[data-state=checking] #gate-message::before,#gate[data-state=loading] #gate-message::before{border:2px solid #ffffff33;border-top-color:var(--accent);animation:badge-turn 1s linear infinite}
#gate[data-state=ready] #gate-message::before{background:var(--accent);transform:scale(.72)}
#gate[data-state=offline] #gate-message::before{border:2px solid var(--muted);background:linear-gradient(135deg,transparent 43%,var(--muted) 43% 57%,transparent 57%)}
#gate[data-state=error] #gate-message::before{content:"!";background:#e63d2e;color:#fff;font:700 var(--fs-small)/14px system-ui,sans-serif;text-align:center}
@keyframes badge-turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#gate[data-state] #gate-message::before{animation:none}}
progress{width:100%;height:6px;accent-color:var(--accent)}
#progress-text{font-size:var(--fs-small);color:var(--muted);min-height:18px;margin:4px 0 0}
.gate-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.gate-actions.menu{grid-area:actions;flex-direction:column;flex-wrap:nowrap;gap:8px;margin:0;justify-content:flex-start}
.gate-actions.menu button{width:100%}
.more-menu{display:flex;flex-direction:column;gap:8px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.more-menu button{min-height:var(--tap)}
.gate-footer{grid-area:footer;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;border-top:1px solid #ffffff10;padding-top:10px}
.gate-footer .tip{margin:0;flex-basis:100%}
.tip{font-size:var(--fs-small);color:var(--muted);margin:12px 0 0}
#build{font-size:var(--fs-small);color:var(--muted);margin:0 0 0 auto;min-height:14px}
.release-notes{text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.release-notes h2{font-size:var(--fs-body);font-weight:600;margin:0 0 6px}
.release-notes ul{margin:10px 0;padding-left:20px;color:#e3e6ec;font-size:var(--fs-small);line-height:1.55}
.release-notes li+li{margin-top:4px}
#notes-check{font-size:var(--fs-small);color:var(--accent);margin:10px 0 0;line-height:1.5}
#toast{position:fixed;z-index:20;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));margin:0;padding:8px 14px;border-radius:10px;background:#0f1217ee;border:1px solid var(--line);color:#fff;font-size:var(--fs-small);text-align:center;pointer-events:none;animation:toast 6s forwards}
/* A newer build found on return from the background: a compact bar over the running game, never a modal. */
#update-banner{position:fixed;z-index:25;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:4px 4px 4px 14px;border-radius:12px;background:#0f1217f2;border:1px solid var(--accent);font-size:var(--fs-small);white-space:nowrap;box-shadow:0 6px 24px #0009}
#update-banner button{min-height:var(--tap);padding:6px 14px;font-size:var(--fs-small);min-width:0}
@keyframes toast{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
dialog{color:inherit;background:#1d2430;border:1px solid var(--line);border-radius:14px;width:min(620px,calc(100% - 32px));max-width:620px;padding:20px}
dialog::backdrop{background:#000b}
dialog h2{font-size:var(--fs-body);margin:0 0 6px}
dialog p{font-size:var(--fs-small);color:var(--muted);line-height:1.5}
#diagnostics-report{display:block;width:100%;height:min(38dvh,260px);font:var(--fs-small)/1.5 ui-monospace,monospace;color:#e0e0d8;background:#10151c;border:1px solid var(--line);padding:10px;resize:vertical;user-select:text;-webkit-user-select:text}
/* Phone landscape (926×428, 926×320): compact header, menu beside it, notes to the right. */
@media (max-height:520px){.gate-main{padding:14px 18px;gap:8px 18px}.crest{width:40px;height:40px;margin-bottom:6px}.eyebrow{margin-bottom:3px}#gate-message{margin-bottom:4px}button{min-height:var(--tap);padding:8px 14px}.gate-actions.menu{gap:6px}.release-notes{padding:12px 16px}.release-notes ul{line-height:1.45;margin:6px 0}#gate{place-items:start center}.gate-card{margin:auto 0}.gate-footer{padding-top:6px}.gate-footer .tip{flex-basis:auto}}
@media (max-width:640px){.gate-card.with-notes{grid-template-columns:1fr;gap:16px}.gate-main{grid-template-columns:1fr;grid-template-areas:"brand" "actions" "footer"}}
@media (max-height:360px){.crest{display:none}.gate-actions.menu{gap:4px}.gate-card{width:min(760px,100%)}.gate-card.with-notes .gate-footer .tip{display:none}}
/* «Ещё…» open: the extra buttons stand in their own column to the right instead of below, so the card never grows past
   the 428 px landscape phone screen (it used to reach 459 px and push «Играть» to the top edge). Notes step aside. */
@media (min-width:641px){.gate-card:has(#more-menu:not([hidden])){width:min(860px,100%);grid-template-columns:1fr}
.gate-card:has(#more-menu:not([hidden])) .release-notes{display:none!important}
.gate-main:has(#more-menu:not([hidden])){grid-template-columns:minmax(0,1fr) auto}
.gate-actions.menu:has(> #more-menu:not([hidden])){display:grid;grid-template-columns:minmax(220px,260px) minmax(200px,240px);column-gap:8px;align-content:start}
.gate-actions.menu:has(> #more-menu:not([hidden])) > button{grid-column:1}
.gate-actions.menu > #more-menu{grid-column:2;grid-row:1 / span 4;align-self:start}}
</style>
</head>
<body>
  <div id="game" hidden></div>
  <section id="gate" role="main" aria-live="polite">
    <div class="sky" aria-hidden="true"><div class="sun"></div><div class="ridge ridge-far"></div><div class="ridge ridge-near"></div><div class="fields"></div></div>
    <div id="gate-card" class="gate-card">
      <div class="gate-main">
        <header class="brand">
          <img class="crest" src="icon-192.png" alt="" aria-hidden="true">
          <p class="eyebrow">Проверка play · надземная игра</p>
          <h1 id="gate-title">Стратегия</h1>
          <p id="gate-message">Открываем меню…</p>
          <progress id="progress" max="1" hidden></progress>
          <p id="progress-text"></p>
        </header>
        <nav class="gate-actions menu" aria-label="Меню">
          <button id="play" class="primary" disabled>Играть</button>
          <button id="play-new" disabled>Начать заново</button>
          <button id="play-demo" disabled hidden>Демо: первые 5 минут</button>
          <button id="more" class="quiet" disabled hidden aria-expanded="false">Ещё…</button>
          <div id="more-menu" class="more-menu" hidden>
            <button id="play-mission1" disabled>Миссия 1</button>
            <button id="play-sandbox" disabled>Тест-миссия</button>
            <button id="play-bench" disabled>Бенчмарк</button>
          </div>
          <button id="update" class="accent" hidden>Обновить</button>
          <button id="retry" hidden>Повторить проверку</button>
          <button id="offline" hidden>Играть в загруженную сборку</button>
          <button id="install" hidden>Установить приложение</button>
        </nav>
        <footer class="gate-footer">
          <button id="sound" class="quiet" aria-pressed="true">Звук: вкл</button>
          <button id="gate-diagnostics" class="quiet">Отчёт о запуске</button>
          <p id="install-tip" class="tip">На iPhone: «Поделиться» → «На экран „Домой“»</p>
          <p id="build"></p>
        </footer>
      </div>
      <section id="release-notes" class="release-notes" aria-labelledby="notes-title" hidden><p class="eyebrow">Что нового <span id="notes-build"></span></p><h2 id="notes-title"></h2><ul id="notes-changes"></ul><p id="notes-check"></p></section>
    </div>
  </section>
  <p id="toast" role="status" hidden></p>
  <div id="update-banner" role="status" hidden><span id="update-text"></span><button id="update-reload" class="primary">Обновить</button><button id="update-later" class="quiet">Позже</button></div>
  <dialog id="diagnostics-dialog"><h2>Отчёт о запуске</h2><p>Здесь сохраняются этап обновления, последний файл и объём загрузки, ошибки и отчёты запуска игры. Отчёт хранится только на этом устройстве.</p><textarea id="diagnostics-report" aria-label="Отчёт о запуске" readonly spellcheck="false"></textarea><div class="gate-actions"><button id="diagnostics-close">Закрыть</button></div></dialog>
  <script>/* A bounded device-local launch receipt. It sends no reports over the network. */
(function () {
  'use strict';
  const key = 'surface-pwa-launch-v1:' + new URL('./', document.baseURI).pathname;
  const phases = new Set(['engine-loading','engine-ready','start-failed','runtime-error','webgl-lost']);
  const updatePhases = new Set(['update-checking','update-downloading','update-retiring','update-ready','update-failed','update-retry','update-available']);
  let saved = {current:null, previous:[], update:null, previousUpdates:[]};
  let lastWrite = 0;
  const label = (v, max = 96) => typeof v === 'string' && /^[a-zA-Z0-9_.-]+$/.test(v) ? v.slice(0,max) : '';
  const bytes = (v) => Number.isSafeInteger(v) && v >= 0 && v <= 1073741824 ? v : 0;
  const errorText = (v) => typeof v === 'string' ? v.replace(/\b(?:https?|file):\/\/\S+/gi,'[url]').replace(/[\u0000-\u001f\u007f]/g,' ').slice(0,240) : '';
  function boundedUpdate(value) {
    if (!value || typeof value !== 'object' || !updatePhases.has(value.phase)) return null;
    return {phase:value.phase, shell:label(value.shell), workerShell:label(value.workerShell),
      protocol:bytes(value.protocol), build:label(value.build,80), release:label(value.release),
      file:label(value.file,80), loaded:bytes(value.loaded), total:bytes(value.total), reused:bytes(value.reused),
      started:String(value.started || '').slice(0,32), updated:String(value.updated || '').slice(0,32),
      error:value.error ? {code:label(value.error.code,32), message:errorText(value.error.message)} : null};
  }
  function boundedRecord(value) {
    if (!value || typeof value !== 'object' || typeof value.release !== 'string'
      || !/^[a-zA-Z0-9_-]{1,96}$/.test(value.release) || typeof value.scene !== 'string'
      || value.scene !== 'menu') return null; // The surface app always opens the game's own main menu.
    const number = (v) => Number.isFinite(v) && v >= 0 && v <= 100000 ? v : 0;
    const record = {build:String(value.build || '').slice(0,80), release:value.release, scene:value.scene,
      phase:phases.has(value.phase) || ['frame-loading','exited','exit-deadline'].includes(value.phase) ? value.phase : 'unknown',
      started:String(value.started || '').slice(0,32), updated:String(value.updated || '').slice(0,32),
      browser:String(value.browser || '').slice(0,200), standalone:!!value.standalone,
      viewport:{width:number(value.viewport?.width),height:number(value.viewport?.height),dpr:number(value.viewport?.dpr)},
      errors:Array.isArray(value.errors) ? value.errors.filter((v)=>typeof v === 'string').slice(0,8).map((v)=>v.slice(0,240)) : []};
    if (value.canvas) record.canvas = {width:number(value.canvas.width), height:number(value.canvas.height)};
    return record;
  }
  try {
    const raw = localStorage.getItem(key);
    if (raw && raw.length < 12000) {
      const value = JSON.parse(raw);
      if (value && Array.isArray(value.previous)) saved = {current:boundedRecord(value.current),
        previous:value.previous.map(boundedRecord).filter(Boolean).slice(0,2), update:boundedUpdate(value.update),
        previousUpdates:Array.isArray(value.previousUpdates) ? value.previousUpdates.map(boundedUpdate).filter(Boolean).slice(0,1) : []};
    }
  } catch (_) {} // Persistence is optional and must never block play.
  function persist(force = true) {
    // Byte callbacks update memory immediately. Avoid synchronous storage writes
    // for every tiny chunk; no timer/heartbeat is added, and terminal phases flush.
    if (!force && Date.now() - lastWrite < 1000) return;
    lastWrite = Date.now();
    // Keep the existing local schema/key and engine history, with a strict total
    // serialized bound even when JSON escaping expands old engine error strings.
    let raw = JSON.stringify(saved);
    while (raw.length >= 12000) {
      if (saved.previousUpdates.length) saved.previousUpdates.pop();
      else if (saved.previous.length) saved.previous.pop();
      else if (saved.current?.errors.length) saved.current.errors.pop();
      else break;
      raw = JSON.stringify(saved);
    }
    try { if (raw.length < 12000) localStorage.setItem(key, raw); } catch (_) {}
  }
  function updateReceipt(phase, data = {}) {
    if (!saved.update || !updatePhases.has(phase)) return;
    const fields = ['workerShell','protocol','build','release','file','loaded','total','reused','error'];
    const record = {...saved.update, phase, updated:new Date().toISOString()};
    for (const field of fields) if (Object.prototype.hasOwnProperty.call(data,field)) record[field] = data[field];
    const changed = saved.update.phase !== phase || saved.update.file !== record.file;
    saved.update = boundedUpdate(record);
    persist(phase !== 'update-downloading' || changed);
  }
  function update(phase, data = {}) {
    if (!saved.current) return;
    const record = saved.current;
    record.phase = phase;
    record.updated = new Date().toISOString();
    if (data.canvas && Number.isFinite(data.canvas.width) && Number.isFinite(data.canvas.height)) {
      record.canvas = {width:data.canvas.width, height:data.canvas.height};
    }
    if (typeof data.error === 'string' && record.errors.length < 8) record.errors.push(data.error.slice(0,240));
    persist();
  }
  window.sgSurfaceDiagnostics = {
    begin(release, scene) {
      if (saved.current) saved.previous = [saved.current, ...saved.previous].slice(0,2);
      saved.current = {build:release.build, release:release.id, scene, phase:'frame-loading',
        started:new Date().toISOString(), browser:String(navigator.userAgent || '').slice(0,200),
        standalone:!!navigator.standalone || matchMedia('(display-mode: standalone)').matches,
        viewport:{width:window.innerWidth, height:window.innerHeight, dpr:window.devicePixelRatio || 1}, errors:[]};
      persist();
    },
    end(reason) { update(reason === 'onExit' ? 'exited' : 'exit-deadline'); },
    beginUpdate(shell) {
      if (saved.update) saved.previousUpdates = [saved.update];
      const now = new Date().toISOString();
      saved.update = boundedUpdate({phase:'update-checking',shell,started:now,updated:now});
      persist();
    },
    updateState: updateReceipt,
  };
  window.addEventListener('message', (event) => {
    const frame = document.getElementById('game-frame');
    const data = event.data;
    if (!frame || event.source !== frame.contentWindow || event.origin !== location.origin
      || !data || data.type !== 'SURFACE_PWA_STATE' || !phases.has(data.phase)) return;
    // Ignore messages from a prior release after the owning frame has navigated.
    const owner = new URL(frame.src, document.baseURI).pathname.match(/\/releases\/([a-zA-Z0-9_-]+)\/game\//);
    if (!saved.current || !owner || owner[1] !== saved.current.release) return;
    update(data.phase, data);
  });
  const dialog = document.getElementById('diagnostics-dialog');
  const report = () => {
    persist(); // The requested report flushes the latest real in-memory byte count.
    document.getElementById('diagnostics-report').value = JSON.stringify(saved, null, 2);
    dialog.showModal();
  };
  document.getElementById('gate-diagnostics')?.addEventListener('click', report);
  document.getElementById('diagnostics-close').addEventListener('click', () => dialog.close());
}());
</script>
  <script>// Menu music and UI sounds of the /surface/ shell. Everything is synthesised with Web Audio: no files to download,
// nothing to license, nothing to cache. The game itself (Godot, in its own frame) has its own audio.
// iOS/Safari rule: an AudioContext starts only inside a user gesture, so unlock() is called from the first tap on the
// menu and the pad fades in from there. The preference lives in localStorage (per device, never required).
(function (root) {
  'use strict';
  const PREF_KEY = 'surface-pwa-sound-v1';
  let context = null, master = null, musicGain = null, uiGain = null, pad = null;
  let enabled = true, unlocked = false, playing = false, fading = null;
  try { enabled = root.localStorage?.getItem(PREF_KEY) !== 'off'; } catch (_) { enabled = true; }
  const AudioContextClass = root.AudioContext || root.webkitAudioContext || null;
  function available() { return !!AudioContextClass; }
  function ensureContext() {
    if (context) return context;
    context = new AudioContextClass({latencyHint: 'playback'});
    master = context.createGain(); master.gain.value = 0.9; master.connect(context.destination);
    musicGain = context.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
    uiGain = context.createGain(); uiGain.gain.value = 0.55; uiGain.connect(master);

      const mb=`${(data.loaded/1048576).toFixed(1)} / ${(data.total/1048576).toFixed(1)} МБ`;
      if(current){status('Загружаем обновление в фоне — можно играть.','loading');}
      else{title('Загружаем обновление');status('Игра откроется, когда сборка будет загружена и проверена целиком.','loading');}
      $('progress').hidden=false; $('progress').max=data.total||1; $('progress').value=data.loaded; $('progress-text').textContent=mb;
    };
    // The shell checks only before a game exists, so this CHECK never needs to retire a live engine.
    let result;
    for(let attempt=0;;attempt++){
      try{result=await watchedCheck(connection,progress);break;}
      catch(error){
        if(error.code!=='WORKER_LOST' || attempt>=2 || launched)throw error;
        updateDiagnostic('update-retry',{attempt:attempt+1});
        status('Загрузка прервалась — продолжаем.','loading');
      }
    }
    if(launched){
      // The player is in the game meanwhile; a finished newer download waits for the next launch or the banner.
      if(result.type==='READY' && result.release && result.release.id!==current?.id)adopt(result.release);
      return;
    }
    if(result.type==='READY'){
      updateDiagnostic('update-ready',{release:result.release?.id,build:result.release?.build});
      await ready(result.release);
    }
    else{
      updateDiagnostic('update-failed',{error:{code:result.code||'UPDATE',message:result.message||'Не удалось подготовить игру.'}});
      offlineCandidate=result.offline || offlineCandidate || null;
      if(current){
        // The menu already runs on a complete release: the failed check is a note beside a retry, not a wall.
        status((result.code==='OFFLINE'?'Нет сети — ':'Обновление не завершено — ')+`играем в сборку ${current.build}.`,result.code==='OFFLINE'?'offline':'error');
        progressVisible(false); $('retry').hidden=false; return;
      }
      // No network at all: the menu opens on the newest complete verified copy right away.
      if(result.code==='OFFLINE' && offlineCandidate){await ready(offlineCandidate,true);return;}
      title(result.code==='OFFLINE'?'Нет соединения':'Обновление не завершено');
      status((result.message || 'Не удалось подготовить игру.')+(result.code==='OFFLINE'?' Для первого запуска нужна сеть.':''),result.code==='OFFLINE'?'offline':'error');
      $('retry').hidden=false; progressVisible(false);
      $('offline').hidden=!offlineCandidate;
      if(offlineCandidate)$('offline').textContent=`Играть в загруженную ${offlineCandidate.build}`;
    }
  }catch(error){
    updateDiagnostic('update-failed',{error:{code:error.code||'CONNECT',message:error.message}});
    if(launched)return;
    if(current){status(`Проверка обновлений не удалась — играем в сборку ${current.build}.`,'error');progressVisible(false);$('retry').hidden=false;return;}
    title('Не удалось запустить приложение'); status(error.message,'error'); $('retry').hidden=false; progressVisible(false);
  }
  finally{busy=false;clearTimeout(offerTimer);}
}
// Back from the background: the running game is never interrupted. The worker compares release.json with the
// running build (metadata only); a newer build shows a banner, and «Обновить» restarts through the normal check.
async function resumeCheck(){
  if(resumeChecking || !current || !navigator.serviceWorker?.controller)return;resumeChecking=true;
  try{
    const result=await rpc('CHECK',null,{activeReleaseId:current.id});
    if(result && result.type==='RETIRE_REQUIRED' && result.release && result.release.id!==current.id && result.release.build){
      $('update-text').textContent=`Вышла сборка ${result.release.build}`;$('update-banner').hidden=false;
      updateDiagnostic('update-available',{release:result.release.id,build:result.release.build});
    }
  }catch(_){}finally{resumeChecking=false;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(hiddenAt===null)hiddenAt=Date.now();return;}
  const away=hiddenAt===null?0:Date.now()-hiddenAt;hiddenAt=null;
  if(probe)probe(); // a check in flight asks at once whether its worker survived the background
  if(launched && away>=RESUME_CHECK_MS)resumeCheck();
});
// The frame reports: an engine that failed to start (show the reason), or the game back in its menu (close the frame).
window.addEventListener('message',(event)=>{
  const frame=$('game-frame'),data=event.data;
  if(!frame || event.source!==frame.contentWindow || event.origin!==location.origin || !data || data.type!=='SURFACE_PWA_STATE')return;
  if(data.phase==='menu'){closeGame();return;}
  if(data.phase!=='start-failed')return;
  gate('Игра не запустилась',typeof data.error==='string' && data.error?data.error.slice(0,240):'Движок не смог стартовать.','error');
  // The frame stays (the engine may still hold the page): menu buttons would do nothing — switch them off, «Перезапустить» is the way.
  enableMenu(false); $('more-menu').hidden=true; $('more').setAttribute('aria-expanded','false');
  progressVisible(false); $('retry').textContent='Перезапустить'; $('retry').hidden=false;
});
function unlockAudio(){ if(audio)audio.unlock(); }
for(const [id,intent] of Object.entries(INTENTS)){
  $(id).addEventListener('click',()=>{
    if(!current || launched || $(id).disabled)return;
    unlockAudio(); if(audio)audio.confirm();
    launch(current,false,intent);
  });
}
$('more').addEventListener('click',()=>{
  unlockAudio(); if(audio)audio.click();
  const open=$('more-menu').hidden; $('more-menu').hidden=!open; $('more').setAttribute('aria-expanded',open?'true':'false');
});
$('sound').addEventListener('click',()=>{
  if(!audio)return;
  unlockAudio();
  const on=audio.setEnabled(!audio.enabled);
  $('sound').textContent=on?'Звук: вкл':'Звук: выкл'; $('sound').setAttribute('aria-pressed',on?'true':'false');
  if(on)audio.click();
});
if(audio){$('sound').textContent=audio.enabled?'Звук: вкл':'Звук: выкл';$('sound').setAttribute('aria-pressed',audio.enabled?'true':'false');}
else $('sound').hidden=true;
// Any first tap on the menu unlocks audio (iOS starts an AudioContext only inside a gesture).
$('gate').addEventListener('pointerdown',unlockAudio,{passive:true});
// iOS Safari applies :active (the 96 % press in app.css) only when a touchstart listener exists: the press shows in the
// frame of the touch, not after the finger lifts. Empty and passive — it never delays scrolling or the click.
document.addEventListener('touchstart',()=>{},{passive:true});
$('gate').addEventListener('touchend',unlockAudio,{passive:true});
$('retry').addEventListener('click',()=>launched?location.reload():check());
$('offline').addEventListener('click',async()=>{if(offlineCandidate && !launched)await ready(offlineCandidate,offlineCandidate.slow && busy?'slow':true);});
$('update').addEventListener('click',()=>{if(pendingRelease && !launched){const next=pendingRelease;pendingRelease=null;adopt(next);} });
$('update-reload').addEventListener('click',()=>{if(audio)audio.click();location.reload();});
$('update-later').addEventListener('click',()=>{$('update-banner').hidden=true;});
window.addEventListener('beforeinstallprompt',(event)=>{event.preventDefault();installEvent=event;$('install').hidden=false;$('install-tip').hidden=true;});
$('install').addEventListener('click',async()=>{if(!installEvent)return;await installEvent.prompt();await installEvent.userChoice;installEvent=null;$('install').hidden=true;});
window.addEventListener('appinstalled',()=>{$('install').hidden=true;$('install-tip').hidden=true;});
if(matchMedia('(display-mode: standalone)').matches || navigator.standalone)$('install-tip').hidden=true;
// Cold start of this document: the menu from the device's newest complete release at once (OFFER, when a worker
// already controls the page), and one network check behind it. Unlock, focus, BFCache restoration and returning
// from the background keep the running game (see resumeCheck).
localProbe();
check();
})();
</script>
