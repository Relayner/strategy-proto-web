<!DOCTYPE html>

	<head>

		<title>Strategy Prototype</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2723696,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
// Injected after the exported engine is created. Only the owning PWA may retire it.
(function (engine) {
  'use strict';
  let started = false, exited = false, quitRequested = false;
  let errorCount = 0;
  const replyPorts = new Set();
  function report(phase, error) {
    if (window.parent === window || typeof window.parent.postMessage !== 'function') return;
    const canvas = typeof document !== 'undefined' ? document.getElementById('canvas') : null;
    const data = {type:'SURFACE_PWA_STATE', phase};
    if (canvas) data.canvas = {width:canvas.width, height:canvas.height};
    if (error) data.error = String(error.message || error).slice(0,240);
    window.parent.postMessage(data, location.origin);
  }
  window.addEventListener('error', (event) => {
    if (errorCount++ < 8) report('runtime-error', event.error || event.message);
  });
  window.addEventListener('unhandledrejection', (event) => {
    if (errorCount++ < 8) report('runtime-error', event.reason);
  });
  const canvas = typeof document !== 'undefined' ? document.getElementById('canvas') : null;
  if (canvas) canvas.addEventListener('webglcontextlost', () => report('webgl-lost', 'WebGL context lost'));
  window.sgSurfaceLaunchFailure = (error) => report('start-failed', error);
  function acknowledge(port) {
    try { port.postMessage({ type: 'SURFACE_PWA_EXIT' }); } finally { port.close(); }
  }
  window.addEventListener('message', (event) => {
    if (window.parent === window || event.source !== window.parent || event.origin !== location.origin
      || !event.data || event.data.type !== 'SURFACE_PWA_QUIT' || !event.ports || !event.ports[0]) return;
    const port = event.ports[0];
    if (exited) { acknowledge(port); return; }
    if (replyPorts.size >= 4) { port.close(); return; }
    replyPorts.add(port);
    quitRequested = true;
    if (started) engine.requestQuit();
  });
  // Saves. Every game on relayner.github.io shared ONE IndexedDB '/userfs' (Godot's user://): /under/ uses the same
  // file names (autosave.sav, ui_settings.cfg…) and a Godot save erases records its own instance did not load, so two
  // open games clobbered each other. package_surface_pwa.py patches index.js to open globalThis.SG_USERFS_DB instead.
  // Before the first start the first existing database of `seed` is COPIED once (never moved or deleted: /under/ and
  // old sNN keep '/userfs'). Any failure starts this session on the shared database exactly as before, and the copy is
  // retried next time. The channel line is rewritten by package_surface_pwa.py: the permanent /surface/ app keeps
  // '/userfs@surface' seeded from '/userfs'; a PR build in /next/<slot>/ gets its own database seeded from the
  // /surface/ one, so a review build never writes the player's saves.
  const SG_CHANNEL = {"saveDb":"/userfs@surface-next-pr22","seed":["/userfs@surface","/userfs"]}; // __SURFACE_CHANNEL__
  const OWN_USERFS = SG_CHANNEL.saveDb;
  const settle = (req) => new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
  function openOwn(idb) {
    return new Promise((resolve, reject) => {
      const req = idb.open(OWN_USERFS, 21);
      req.onupgradeneeded = () => { // The schema of Emscripten IDBFS (DB_VERSION 21, store FILE_DATA, index timestamp).
        const db = req.result, store = db.objectStoreNames.contains('FILE_DATA') ? req.transaction.objectStore('FILE_DATA') : db.createObjectStore('FILE_DATA');
        if (!store.indexNames.contains('timestamp')) store.createIndex('timestamp', 'timestamp', {unique: false});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('Own save database unavailable'));
      req.onblocked = () => reject(new Error('Own save database blocked'));
    });
  }
  function openShared(idb, name) {
    return new Promise((resolve, reject) => {
      let absent = false;
      const req = idb.open(name);
      // No such database on this device: abort the implicit creation (the new database is discarded), copy nothing.
      req.onupgradeneeded = (event) => { absent = event.oldVersion === 0; req.transaction.abort(); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = (event) => { if (absent) { if (event && event.preventDefault) event.preventDefault(); resolve(null); } else reject(req.error || new Error('Shared save database unavailable')); };
    });
  }
  // Copy every record of the first seed database that has any; false — none of them has records.
  async function copySeed(idb, own, cancelled) {
    for (const name of SG_CHANNEL.seed) {
      if (name === OWN_USERFS) continue;
      const shared = await openShared(idb, name);
      if (!shared) continue;
      try {
        if (!shared.objectStoreNames.contains('FILE_DATA')) continue;
        const source = shared.transaction('FILE_DATA', 'readonly').objectStore('FILE_DATA');
        const [keys, values] = await Promise.all([settle(source.getAllKeys()), settle(source.getAll())]);
        if (!keys.length) continue;
        if (cancelled()) throw new Error('Save copy timed out');
        const tx = own.transaction('FILE_DATA', 'readwrite'), target = tx.objectStore('FILE_DATA');
        keys.forEach((key, index) => target.put(values[index], key));
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onabort = tx.onerror = () => reject(tx.error || new Error('Save copy aborted'));
        });
        return true;
      } finally { shared.close(); }
    }
    return false;
  }
  async function prepareSaves(idb, cancelled) {
    const own = await openOwn(idb);
    try {
      if (await settle(own.transaction('FILE_DATA', 'readonly').objectStore('FILE_DATA').count()) > 0) return true;
      await copySeed(idb, own, cancelled);
      return true;
    } finally { own.close(); }
  }
  function useOwnSaves() {
    const idb = typeof indexedDB !== 'undefined' ? indexedDB : null;
    if (!idb) return Promise.resolve(false);
    let timer, cancelled = false;
    const deadline = new Promise((resolve) => { timer = setTimeout(() => { cancelled = true; resolve(false); }, 15000); });
    return Promise.race([prepareSaves(idb, () => cancelled), deadline]).then((own) => {
      if (own && !cancelled) globalThis.SG_USERFS_DB = OWN_USERFS;
      return !!own && !cancelled;
    }, (error) => {
      console.warn('Saves: own database unavailable, using the shared one this time.', error);
      return false;
    }).finally(() => clearTimeout(timer));
  }
  const startGame = engine.startGame.bind(engine);
  engine.startGame = function (override) {
    const options = Object.assign({}, override);
    const priorExit = options.onExit || GODOT_CONFIG.onExit;
    const priorError = options.onPrintError || GODOT_CONFIG.onPrintError || console.error;
    options.onPrintError = function (...args) {
      if (!exited && errorCount++ < 8) report('runtime-error', args.join(' '));
      if (typeof priorError === 'function') priorError.apply(null, args);
    };
    // Godot's documented callback runs after its asynchronous exit and engine cleanup.
    options.onExit = function (code) {
      exited = true;
      replyPorts.forEach(acknowledge);
      replyPorts.clear();
      if (typeof priorExit === 'function') priorExit(code);
    };
    report('engine-loading');
    return useOwnSaves().then(() => startGame(options)).then((result) => {
      started = true;
      report('engine-ready');
      if (quitRequested && !exited) engine.requestQuit();
      return result;
    }, (error) => {
      report('start-failed', error);
      throw error;
    });
  };
})(engine);


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
