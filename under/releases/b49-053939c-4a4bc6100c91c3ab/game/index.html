<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<!--
		ПОДЗЕМЕЛЬЕ-UX (отзыв владельца 2026-09-24, п. 6; решение 2026-09-26; трек layout): оболочка веб-пресета «Web Under».
		ПЗ-42 «Б» только для подземелья: viewport-fit=cover — холст на весь экран iPhone в альбоме (926×428 pt, под вырез и
		скругления), без пустых полос по 47 pt слева и справа, как у обычного «Web» (ПЗ-42 «А», он не меняется).
		UI слоя сам отступает на env(safe-area-inset-*): их читает scripts/ui/under_safe_area.gd через JavaScriptBridge.
		window.ugUnderShell.setCover(on) — игра снимает cover при выходе из подземелья (меню и поверхность — как в «Web») и
		возвращает при входе. Без параметра ?scene=… сборка сразу открывает подземелье (?scene=under); другая сцена в строке
		запроса (?scene=mission, bench…) стартует без cover — как в «Web».
		Остальное — стандартная оболочка Godot 4.6.3 (godot.html шаблона web_nothreads).
		-->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Strategy Prototype</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<script>
(function () {
	// Сборка подземелья: без ?scene=… — сразу в подземелье (boot читает scene из строки запроса).
	let scene = 'under';
	try {
		const q = new URLSearchParams(window.location.search);
		if (!q.has('scene')) {
			q.set('scene', 'under');
			window.history.replaceState(null, '', window.location.pathname + '?' + q.toString() + window.location.hash);
		}
		scene = q.get('scene');
	} catch (e) {
		console.warn('[under_shell] scene=under:', e);
	}
	function viewportMeta() {
		let m = document.querySelector('meta[name="viewport"]');
		if (!m) {
			m = document.createElement('meta');
			m.name = 'viewport';
			m.content = 'width=device-width, user-scalable=no, initial-scale=1.0';
			document.head.appendChild(m);
		}
		return m;
	}
	// API оболочки для игры (scripts/ui/under_safe_area.gd). Есть только в этой оболочке: в обычном «Web» игра ничего
	// не переключает, отступы там нулевые (без cover env(safe-area-inset-*) = 0).
	window.ugUnderShell = {
		version: 1,
		setCover: function (on) {
			const m = viewportMeta();
			const base = m.content.replace(/,?\s*viewport-fit=[a-z]+/g, '');
			m.content = on ? base + ', viewport-fit=cover' : base;
			return m.content;
		},
	};
	// Другая сцена по ?scene=… (меню, поверхность) — без cover, как в «Web»; подземелье включит его само при входе.
	if (scene !== 'under') {
		window.ugUnderShell.setCover(false);
	}
}());
		</script>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Подземелье">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5663868,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
// Injected after the exported engine is created. Only the owning PWA may retire it.
(function (engine) {
  'use strict';
  let started = false, exited = false, quitRequested = false;
  let errorCount = 0;
  const replyPorts = new Set();
  function report(phase, error) {
    if (window.parent === window || typeof window.parent.postMessage !== 'function') return;
    const canvas = typeof document !== 'undefined' ? document.getElementById('canvas') : null;
    const data = {type:'UNDER_PWA_STATE', phase};
    if (canvas) data.canvas = {width:canvas.width, height:canvas.height};
    if (error) data.error = String(error.message || error).slice(0,240);
    window.parent.postMessage(data, location.origin);
  }
  window.addEventListener('error', (event) => {
    if (errorCount++ < 8) report('runtime-error', event.error || event.message);
  });
  window.addEventListener('unhandledrejection', (event) => {
    if (errorCount++ < 8) report('runtime-error', event.reason);
  });
  const canvas = typeof document !== 'undefined' ? document.getElementById('canvas') : null;
  if (canvas) canvas.addEventListener('webglcontextlost', () => report('webgl-lost', 'WebGL context lost'));
  window.ugUnderLaunchFailure = (error) => report('start-failed', error);
  function acknowledge(port) {
    try { port.postMessage({ type: 'UNDER_PWA_EXIT' }); } finally { port.close(); }
  }
  window.addEventListener('message', (event) => {
    if (window.parent === window || event.source !== window.parent || event.origin !== location.origin
      || !event.data || event.data.type !== 'UNDER_PWA_QUIT' || !event.ports || !event.ports[0]) return;
    const port = event.ports[0];
    if (exited) { acknowledge(port); return; }
    if (replyPorts.size >= 4) { port.close(); return; }
    replyPorts.add(port);
    quitRequested = true;
    if (started) engine.requestQuit();
  });
  const startGame = engine.startGame.bind(engine);
  engine.startGame = function (override) {
    const options = Object.assign({}, override);
    const priorExit = options.onExit || GODOT_CONFIG.onExit;
    const priorError = options.onPrintError || GODOT_CONFIG.onPrintError || console.error;
    options.onPrintError = function (...args) {
      if (!exited && errorCount++ < 8) report('runtime-error', args.join(' '));
      if (typeof priorError === 'function') priorError.apply(null, args);
    };
    // Godot's documented callback runs after its asynchronous exit and engine cleanup.
    options.onExit = function (code) {
      exited = true;
      replyPorts.forEach(acknowledge);
      replyPorts.clear();
      if (typeof priorExit === 'function') priorExit(code);
    };
    report('engine-loading');
    return startGame(options).then((result) => {
      started = true;
      report('engine-ready');
      if (quitRequested && !exited) engine.requestQuit();
      return result;
    }, (error) => {
      report('start-failed', error);
      throw error;
    });
  };
})(engine);


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (typeof window.ugUnderLaunchFailure === 'function') window.ugUnderLaunchFailure(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
